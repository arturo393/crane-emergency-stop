name: ESP32 Gateway Progress Tracker

on:
  push:
    branches: [main, clean-main]
    paths:
      - 'esp32_gateway/**'
      - '.github/workflows/esp32-progress-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  track-esp32-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find or create ESP32 tracking issue
        id: find-issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Search for existing issue
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: 'esp32-gateway',
              state: 'open'
            });
            
            let issueNumber;
            if (issues.data.length > 0) {
              issueNumber = issues.data[0].number;
              console.log(`Found existing issue #${issueNumber}`);
            } else {
              // Create new issue
              const newIssue = await github.rest.issues.create({
                owner,
                repo,
                title: '🔧 ESP32 Gateway Development Progress',
                labels: ['esp32-gateway', 'enhancement', 'tracking'],
                body: `# ESP32 Gateway Development Tracking

This issue tracks the progress of ESP32-S3 firmware development.

## Progress Checklist
- [ ] CAN/TWAI Manager
- [ ] CANopen CiA 402 implementation
- [ ] RPDO/TPDO handlers
- [ ] WiFi Manager
- [ ] Ethernet Manager
- [ ] OTA Manager
- [ ] NVS Configuration
- [ ] Unit tests
- [ ] Integration tests
- [ ] Hardware validation

**Last updated:** ${new Date().toISOString()}
**Auto-generated by GitHub Actions**`
              });
              issueNumber = newIssue.data.number;
              console.log(`Created new issue #${issueNumber}`);
            }
            
            core.setOutput('issue_number', issueNumber);
            return issueNumber;

      - name: Analyze ESP32 project status
        id: analyze
        run: |
          echo "Analyzing ESP32 project..."
          
          # Count completed components
          can_manager=$([ -f "esp32_gateway/components/canopen/can_manager.cpp" ] && echo "✅" || echo "⬜")
          cia402=$([ -f "esp32_gateway/components/canopen/cia402.cpp" ] && echo "✅" || echo "⬜")
          pdo=$([ -f "esp32_gateway/components/canopen/pdo.h" ] && echo "✅" || echo "⬜")
          wifi=$([ -f "esp32_gateway/main/wifi_manager.cpp" ] && echo "⬜" || echo "⬜")
          ethernet=$([ -f "esp32_gateway/components/network/ethernet_manager.cpp" ] && echo "⬜" || echo "⬜")
          ota=$([ -f "esp32_gateway/components/ota/ota_manager.cpp" ] && echo "⬜" || echo "⬜")
          
          # Create status summary
          cat > status.txt << EOF
          ## 📊 Component Status
          
          | Component | Status |
          |-----------|--------|
          | CAN Manager | ${can_manager} |
          | CiA 402 | ${cia402} |
          | PDO Handlers | ${pdo} |
          | WiFi Manager | ${wifi} |
          | Ethernet Manager | ${ethernet} |
          | OTA Manager | ${ota} |
          EOF
          
          echo "status_file=status.txt" >> $GITHUB_OUTPUT

      - name: Update issue with progress
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNumber = ${{ steps.find-issue.outputs.issue_number }};
            const statusContent = fs.readFileSync('status.txt', 'utf8');
            
            const body = `# ESP32 Gateway Development Tracking

This issue tracks the progress of ESP32-S3 firmware development.

${statusContent}

## 🎯 Next Steps
- [ ] Integrate NVS for configuration storage
- [ ] Complete Ethernet Manager implementation
- [ ] Integrate OTA Manager in main loop
- [ ] Add unit tests for CiA 402 state machine
- [ ] Document hardware setup and testing procedures

## 📁 Recent Changes
Commit: ${context.sha.substring(0, 7)}
Branch: ${context.ref.replace('refs/heads/', '')}

**Last updated:** ${new Date().toISOString()}
**Auto-generated by GitHub Actions**`;

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
            
            console.log(`✅ Updated issue #${issueNumber}`);
