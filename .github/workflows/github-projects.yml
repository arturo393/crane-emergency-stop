name: GitHub Projects Automation

on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, closed, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write
  projects: write

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      projects: write
    steps:
      - name: Add ESP32 issues to project (ProjectV2)
        if: contains(github.event.issue.labels.*.name, 'esp32') || contains(github.event.pull_request.labels.*.name, 'esp32')
        uses: actions/github-script@v7
        with:
          script: |
            // Using ProjectV2 ID (provided earlier as PVT_kwHOAAss984BFkkY)
            const projectId = 'PVT_kwHOAAss984BFkkY';
            const payloadItem = context.payload.issue || context.payload.pull_request;
            if (!payloadItem) {
              core.info('No issue or pull_request in payload, skipping project add');
              return;
            }
            const contentId = payloadItem.node_id;
            console.log(`Adding content ${contentId} to project ${projectId}`);
            try {
              await github.graphql(
                `mutation ($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }`,
                { projectId, contentId }
              );
              console.log('Successfully added item to ProjectV2');
            } catch (error) {
              console.error('Failed to add item to ProjectV2:', error);
              throw error;
            }

  move-columns:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Move issue based on state and labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            const isClosed = issue.state === 'closed';
            
            // Determine column based on state and labels
            let targetColumn = null;
            
            if (isClosed) {
              targetColumn = 'Done';
            } else if (labels.includes('priority:high')) {
              targetColumn = 'In Progress';
            } else if (labels.includes('blocked')) {
              targetColumn = 'Blocked';
            } else if (labels.includes('ready-for-review')) {
              targetColumn = 'Review';
            } else {
              targetColumn = 'Todo';
            }
            
            console.log(`Issue #${issue.number} should be in column: ${targetColumn}`);
            console.log('Note: Automatic column movement requires GitHub Projects (beta) GraphQL API');
            console.log('Manual column assignment recommended for now');
