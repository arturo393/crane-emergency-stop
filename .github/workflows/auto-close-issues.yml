name: Issue Auto-Closer

on:
  push:
    branches: [main, clean-main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  close-completed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Close issues for completed work
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read README to check completed items
            const readme = fs.readFileSync('README.md', 'utf8');
            const esp32Readme = fs.readFileSync('esp32_gateway/README.md', 'utf8');
            
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'esp32-gateway'
            });
            
            for (const issue of issues.data) {
              const title = issue.title.toLowerCase();
              
              // Auto-close if component is marked complete
              if (title.includes('can manager') && esp32Readme.includes('[x] CAN Manager')) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: '✅ Auto-closed: Component marked as complete in README.'
                });
              }
            }
