name: ESP32 Progress Tracker

on:
  push:
    branches: [main, clean-main]
    paths:
      - 'esp32_gateway/**'
      - '.github/workflows/esp32-simple-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update tracker issue
        uses: actions/github-script@v7
        env:
          TRACKER_ISSUE: 1
        with:
          script: |
            const fs = require('fs');
            const issueNumber = process.env.TRACKER_ISSUE;
            
            // Read README files
            const mainReadme = fs.readFileSync('README.md', 'utf8');
            const esp32Readme = fs.readFileSync('esp32_gateway/README.md', 'utf8');
            
            // Extract completion status
            const canManagerDone = esp32Readme.includes('[x] CAN Manager');
            const wifiManagerDone = esp32Readme.includes('[x] WiFi Manager');
            const cia402Done = esp32Readme.includes('[x] CiA 402 State Machine');
            const pdoDone = esp32Readme.includes('[x] PDO Handler');
            const sdoDone = esp32Readme.includes('[x] SDO Handler');
            const otaDone = esp32Readme.includes('[x] OTA Updates');
            const tcpServerDone = esp32Readme.includes('[x] TCP Server');
            
            // Calculate progress
            const total = 7;
            const completed = [canManagerDone, wifiManagerDone, cia402Done, pdoDone, sdoDone, otaDone, tcpServerDone].filter(Boolean).length;
            const percentage = Math.round((completed / total) * 100);
            
            // Build status list
            const components = [
              { name: 'CAN Manager', done: canManagerDone },
              { name: 'WiFi Manager', done: wifiManagerDone },
              { name: 'CiA 402 State Machine', done: cia402Done },
              { name: 'PDO Handler', done: pdoDone },
              { name: 'SDO Handler', done: sdoDone },
              { name: 'OTA Updates', done: otaDone },
              { name: 'TCP Server', done: tcpServerDone }
            ];
            
            let statusList = components.map(c => 
              c.done ? `- ✅ ${c.name}` : `- ⏳ ${c.name}`
            ).join('\n');
            
            // Build update body
            const today = new Date().toISOString().split('T')[0];
            const body = [
              '## ESP32 Gateway Progress Tracker',
              '',
              `**Overall Progress:** ${completed}/${total} (${percentage}%)`,
              '',
              '### Component Status',
              statusList,
              '',
              '---',
              `*Last updated: ${today}*`,
              '*Auto-generated by GitHub Actions*'
            ].join('\n');
            
            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                body: body
              });
              
              console.log(`✅ Updated tracker issue #${issueNumber}`);
            } catch (error) {
              console.log(`⚠️ Could not update issue #${issueNumber}: ${error.message}`);
              console.log('Creating new tracker issue...');
              
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📊 ESP32 Gateway Development Tracker',
                body: body,
                labels: ['esp32-gateway', 'tracking']
              });
              
              console.log(`✅ Created new tracker issue #${newIssue.data.number}`);
            }
