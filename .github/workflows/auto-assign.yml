name: Auto Assign Issues

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign to creator
        uses: actions/github-script@v7
        with:
          script: |
            const isIssue = context.payload.issue;
            const isPR = context.payload.pull_request;
            const creator = isIssue ? context.payload.issue.user.login : context.payload.pull_request.user.login;
            const number = isIssue ? context.payload.issue.number : context.payload.pull_request.number;
            
            console.log(`Auto-assigning ${isIssue ? 'issue' : 'PR'} #${number} to @${creator}`);
            
            if (isIssue) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                assignees: [creator]
              });
            } else {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                assignees: [creator]
              });
            }
