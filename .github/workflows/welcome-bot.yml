name: Welcome Bot

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome comment on ESP32 issues
        if: contains(github.event.issue.labels.*.name, 'esp32-gateway')
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            
            const message = [
              '¡Gracias por reportar este issue para el ESP32 Gateway! 🚀',
              '',
              'Este issue ha sido:',
              '- ✅ Etiquetado automáticamente',
              '- ✅ Asignado a ti',
              '- ✅ Agregado al milestone correspondiente',
              '',
              '**Recursos útiles:**',
              '- [README del ESP32](../blob/main/esp32_gateway/README.md)',
              '- [Documentación CANopen](../blob/main/docs/research/canopen_protocol.md)',
              '- [Tracker de progreso](../issues?q=is:issue+label:tracking+is:open)',
              '',
              'El workflow de CI/CD se ejecutará automáticamente cuando hagas commits.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: message
            });
